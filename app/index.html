<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <!-- The site translates itself (src/i18n.js): no browser translation on top of it. -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>Goals — Goalcraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&family=Rubik:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
  <nav class="sitebar">
    <a class="logo" href="../"><img class="mark" src="../favicon.svg" alt="" width="24" height="24">Goalcraft</a>
    <div class="links">
      <span class="updated wide" id="day"></span><button id="refresh" class="refresh" title="Refresh now" data-i18n-attr="title:app.refreshTitle"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="wide" data-i18n="app.refresh">Refresh</span></button>
      <a class="signin" href="../login/" data-i18n="nav.signin">Sign in</a>
    </div>
  </nav>
  <header id="titles">
    <div id="titles-track"></div>
    <div id="clock"></div>
  </header>
  <!-- Shown until the board is drawn. -->
  <div class="loader" role="status" aria-label="Loading"><svg viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" aria-hidden="true"><g><rect x="19" y="12" width="11" height="8" fill="#6E6A66"/><rect x="19" y="12" width="11" height="2" fill="#8C8781"/><rect x="21" y="15" width="2" height="2" fill="#57534F"/><rect x="26" y="16" width="2" height="2" fill="#57534F"/></g><g class="spark"><rect x="26" y="9" width="1" height="1" fill="#F2C14E"/><rect x="27" y="7" width="1" height="1" fill="#FFE08A"/><rect x="25" y="6" width="1" height="1" fill="#F2C14E"/><rect x="21" y="9" width="1" height="1" fill="#F2C14E"/></g><g class="pick"><rect x="13" y="13" width="1" height="1" fill="#8A5A2B"/><rect x="14" y="12" width="1" height="1" fill="#8A5A2B"/><rect x="15" y="11" width="1" height="1" fill="#8A5A2B"/><rect x="16" y="10" width="1" height="1" fill="#8A5A2B"/><rect x="17" y="9" width="1" height="1" fill="#8A5A2B"/><rect x="18" y="8" width="1" height="1" fill="#8A5A2B"/><rect x="19" y="7" width="1" height="1" fill="#8A5A2B"/><rect x="14" y="13" width="1" height="1" fill="#5E3B1B"/><rect x="15" y="12" width="1" height="1" fill="#5E3B1B"/><rect x="16" y="11" width="1" height="1" fill="#5E3B1B"/><rect x="17" y="10" width="1" height="1" fill="#5E3B1B"/><rect x="18" y="9" width="1" height="1" fill="#5E3B1B"/><rect x="19" y="8" width="1" height="1" fill="#5E3B1B"/><rect x="15" y="2" width="1" height="1" fill="#C9D1D9"/><rect x="16" y="2" width="1" height="1" fill="#C9D1D9"/><rect x="17" y="2" width="1" height="1" fill="#C9D1D9"/><rect x="18" y="3" width="1" height="1" fill="#C9D1D9"/><rect x="19" y="4" width="1" height="1" fill="#C9D1D9"/><rect x="20" y="5" width="1" height="1" fill="#C9D1D9"/><rect x="21" y="6" width="1" height="1" fill="#C9D1D9"/><rect x="22" y="7" width="1" height="1" fill="#C9D1D9"/><rect x="23" y="8" width="1" height="1" fill="#C9D1D9"/><rect x="23" y="9" width="1" height="1" fill="#C9D1D9"/><rect x="23" y="10" width="1" height="1" fill="#C9D1D9"/><rect x="14" y="3" width="1" height="1" fill="#7A848E"/><rect x="16" y="3" width="1" height="1" fill="#7A848E"/><rect x="17" y="3" width="1" height="1" fill="#7A848E"/><rect x="18" y="4" width="1" height="1" fill="#7A848E"/><rect x="19" y="5" width="1" height="1" fill="#7A848E"/><rect x="20" y="6" width="1" height="1" fill="#7A848E"/><rect x="21" y="7" width="1" height="1" fill="#7A848E"/><rect x="22" y="8" width="1" height="1" fill="#7A848E"/><rect x="22" y="9" width="1" height="1" fill="#7A848E"/><rect x="22" y="10" width="1" height="1" fill="#7A848E"/><rect x="22" y="11" width="1" height="1" fill="#7A848E"/></g></svg></div>
  <main id="scroller">
    <canvas id="scene" hidden></canvas>
    <section class="connect" id="connect" hidden>
      <h1 data-i18n="connect.empty.h1">Connect your agents</h1>
      <p data-i18n="connect.intro">Paste this into your agent: Claude, ChatGPT, Cursor or any other that supports MCP. It connects Goalcraft, or tells you how.</p>
      <pre data-connect-prompt></pre>
      <p data-i18n-html="connect.empty.after">Then tell it which goal to work on, and your funnels appear here. Not sure what it will look like? <a href="../demo/">See the demo</a>.</p>
    </section>
  </main>
  <div id="pop" hidden></div>

  <script type="module">
    import { supabase } from '../src/auth.js?v=394d4c9c';
    import { setUpConnect } from '../src/connect.js?v=394d4c9c';
    import { loadFunnels, answer, watch, runs, closeReplies } from '../src/live.js?v=394d4c9c';
    import { mountDashboard } from '../src/dashboard.js?v=394d4c9c';
    import { t, fmtDuration } from '../src/i18n.js?v=394d4c9c';

    // Coming back from an email link, supabase-js reads the session from the URL.
    const { data: { session } } = await supabase.auth.getSession();
    // Not signed in. A sign-in link that failed (used already or expired) comes back with
    // #error=…: pass it on so the sign-in page can say what happened.
    if (!session) location.replace('../login/' + (/[#&]error/.test(location.hash) ? location.hash : ''));
    else {
      // Drop the leftover '#' from the sign-in redirect.
      if (location.hash || location.search) history.replaceState(null, '', location.pathname);
      setUpConnect(document.getElementById('connect'));
      start();
    }

    // The person's funnels, redrawn whenever an agent writes.
    async function start() {
      const canvas = document.getElementById('scene'), connect = document.getElementById('connect');
      let board = null, pending = false;
      const show = funnels => {
        const empty = !funnels.length;
        connect.hidden = !empty;
        canvas.hidden = empty;
        document.getElementById('titles').hidden = empty;
        if (empty) { document.body.classList.add('ready'); return; }
        if (!board) board = mountDashboard(funnels, { live: true, onAnswer: answer, runs, onCloseReplies: closeReplies, orderKey: 'goalcraft-order-live' });
        else if (!board.setFunnels(funnels)) pending = true; // the person is typing an answer
      };
      // "Updated 12s ago" next to a Refresh button, like a live dashboard.
      const day = document.getElementById('day'), button = document.getElementById('refresh');
      let loadedAt = null;
      const ago = () => {
        if (!loadedAt) return;
        const sec = Math.round((Date.now() - loadedAt) / 1000);
        day.textContent = t('app.updated', fmtDuration(sec));
      };
      setInterval(ago, 1000);
      const refresh = async () => {
        button.disabled = true;
        try { pending = false; show(await loadFunnels()); loadedAt = Date.now(); ago(); }
        catch (e) { console.error(e); day.textContent = t('app.failed'); document.body.classList.add('ready'); }
        button.disabled = false;
      };
      button.addEventListener('click', refresh);
      await refresh();
      watch(refresh);
      // Flows and timers move with time even when nobody writes.
      setInterval(refresh, 60e3);
      document.addEventListener('focusout', () => { if (pending) refresh(); });
    }
  </script>
  <script type="module" src="../src/nav.js?v=394d4c9c"></script>
</body>
</html>
