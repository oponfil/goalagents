<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>Goals — GoalAgents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dashboard.css?v=767957f0">
</head>
<body>
  <nav class="sitebar">
    <a class="logo" href="../"><img class="mark" src="../favicon.svg" alt="" width="24" height="24">Goal<span>Agents</span></a>
    <div class="links">
      <span class="updated wide" id="day"></span><button id="refresh" class="refresh wide" title="Refresh now" data-i18n-attr="title:app.refreshTitle"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span data-i18n="app.refresh">Refresh</span></button>
      <a class="signin" href="../login/" data-i18n="nav.signin">Sign in</a>
    </div>
  </nav>
  <header id="titles">
    <div id="titles-track"></div>
    <div id="clock"></div>
  </header>
  <main id="scroller">
    <canvas id="scene" hidden></canvas>
    <section class="connect" id="connect" hidden>
      <h1 data-i18n="connect.empty.h1">Connect your agents</h1>
      <p data-i18n="connect.intro">Paste this into your agent: Claude, ChatGPT, Cursor or any other that supports MCP. It connects GoalAgents, or tells you how.</p>
      <pre data-connect-prompt></pre>
      <p data-i18n-html="connect.empty.after">Then tell it which goal to work on, and your funnels appear here. Not sure what it will look like? <a href="../demo/">See the demo</a>.</p>
    </section>
  </main>
  <div id="pop" hidden></div>

  <script type="module">
    import { supabase } from '../src/auth.js?v=767957f0';
    import { setUpConnect } from '../src/connect.js?v=767957f0';
    import { loadFunnels, answer, watch, runs } from '../src/live.js?v=767957f0';
    import { mountDashboard } from '../src/dashboard.js?v=767957f0';
    import { t, fmtDuration } from '../src/i18n.js?v=767957f0';

    // Coming back from an email link, supabase-js reads the session from the URL.
    const { data: { session } } = await supabase.auth.getSession();
    // Not signed in. A sign-in link that failed (used already or expired) comes back with
    // #error=…: pass it on so the sign-in page can say what happened.
    if (!session) location.replace('../login/' + (/[#&]error/.test(location.hash) ? location.hash : ''));
    else {
      // Drop the leftover '#' from the sign-in redirect.
      if (location.hash || location.search) history.replaceState(null, '', location.pathname);
      setUpConnect(document.getElementById('connect'));
      start();
    }

    // The person's funnels, redrawn whenever an agent writes.
    async function start() {
      const canvas = document.getElementById('scene'), connect = document.getElementById('connect');
      let board = null, pending = false;
      const show = funnels => {
        const empty = !funnels.length;
        connect.hidden = !empty;
        canvas.hidden = empty;
        document.getElementById('titles').hidden = empty;
        if (empty) return;
        if (!board) board = mountDashboard(funnels, { live: true, onAnswer: answer, runs, orderKey: 'goalagents-order-live' });
        else if (!board.setFunnels(funnels)) pending = true; // the person is typing an answer
      };
      // "Updated 12s ago" next to a Refresh button, like a live dashboard.
      const day = document.getElementById('day'), button = document.getElementById('refresh');
      let loadedAt = null;
      const ago = () => {
        if (!loadedAt) return;
        const sec = Math.round((Date.now() - loadedAt) / 1000);
        day.textContent = t('app.updated', fmtDuration(sec));
      };
      setInterval(ago, 1000);
      const refresh = async () => {
        button.disabled = true;
        try { pending = false; show(await loadFunnels()); loadedAt = Date.now(); ago(); }
        catch (e) { console.error(e); day.textContent = t('app.failed'); }
        button.disabled = false;
      };
      button.addEventListener('click', refresh);
      await refresh();
      watch(refresh);
      // Flows and timers move with time even when nobody writes.
      setInterval(refresh, 60e3);
      document.addEventListener('focusout', () => { if (pending) refresh(); });
    }
  </script>
  <script type="module" src="../src/nav.js?v=767957f0"></script>
</body>
</html>
