<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Render README images</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #1B1714; color: #F4EDE1; font: 14px Rubik, sans-serif; margin: 16px; }
    canvas { display: block; margin: 12px 0; image-rendering: pixelated; max-width: 100%; }
  </style>
</head>
<body>
  <p id="status">Rendering…</p>
  <!-- The pictures are in English whatever the browser's language. -->
  <script>{ const q = new URLSearchParams(location.search); if (q.get('lang') !== 'en') { q.set('lang', 'en'); location.replace('?' + q); } }</script>
  <script type="module" src="render-docs.js?v=4f921199"></script>
</body>
</html>
