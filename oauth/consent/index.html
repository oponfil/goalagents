<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <!-- The site translates itself (src/i18n.js): no browser translation on top of it. -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <title>Connect an agent — GoalAgents</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../site.css?v=fe97aa4f">
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="../../"><img class="mark" src="../../favicon.svg" alt="" width="24" height="24">Goal<span>Agents</span></a>
    </nav>

    <div class="card" id="card">
      <p class="sub" data-i18n="consent.loading">Loading…</p>
    </div>
  </div>

  <script type="module">
    // OAuth consent: Supabase Auth sends the person here with ?authorization_id= when an agent
    // (Claude, ChatGPT, Cursor…) asks to connect to their GoalAgents.
    import { supabase, siteUrl } from '../../src/auth.js?v=fe97aa4f';
    import { t } from '../../src/i18n.js?v=fe97aa4f';

    const card = document.getElementById('card');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    const show = html => { card.innerHTML = html; };
    const problem = text => show(`<h1>${esc(t('consent.cant'))}</h1><p class="sub">${esc(text)}</p>
      <a class="btn" href="${siteUrl('app/')}">${esc(t('consent.toGoals'))}</a>`);

    const id = new URLSearchParams(location.search).get('authorization_id');
    if (!id) problem(t('consent.noRequest'));
    else {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        location.replace(siteUrl('login/') + '?next=' + encodeURIComponent(location.pathname + location.search));
      } else {
        const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(id);
        if (error) problem(error.message);
        else if (data.redirect_url) location.replace(data.redirect_url); // already allowed before
        else ask(data, session.user.email);
      }
    }

    function ask(d, email) {
      const name = d.client?.name || t('consent.anApp');
      let host = '';
      try { host = new URL(d.redirect_uri).host; } catch {}
      show(`
        <h1>${esc(t('consent.h1', name))}</h1>
        <p class="sub">${esc(t('consent.wants', name, email))}</p>
        <ul class="perm">
          <li>${esc(t('consent.p1'))}</li>
          <li>${esc(t('consent.p2'))}</li>
          <li>${esc(t('consent.p3'))}</li>
        </ul>
        <p class="note">${esc(t('consent.note', host || t('consent.theApp')))}</p>
        <button class="btn primary" id="allow">${esc(t('consent.allow'))}</button>
        <button class="btn" id="deny" style="margin-top:10px">${esc(t('consent.deny'))}</button>
        <div class="msg" id="msg"></div>`);
      const decide = approve => async () => {
        card.querySelectorAll('button').forEach(b => { b.disabled = true; });
        const { data, error } = approve
          ? await supabase.auth.oauth.approveAuthorization(d.authorization_id)
          : await supabase.auth.oauth.denyAuthorization(d.authorization_id);
        if (error) {
          const msg = document.getElementById('msg');
          msg.textContent = error.message; msg.className = 'msg error';
          card.querySelectorAll('button').forEach(b => { b.disabled = false; });
        } else {
          location.replace(data.redirect_url);
          // Apps often take the redirect over (claude://, a local callback), so the browser stays on
          // this page: after a moment, say it is done instead of leaving the buttons greyed out.
          setTimeout(() => {
            card.querySelectorAll('button').forEach(b => b.remove());
            const msg = document.getElementById('msg');
            msg.textContent = t(approve ? 'consent.done' : 'consent.denied'); msg.className = 'msg ok';
          }, 2500);
        }
      };
      document.getElementById('allow').addEventListener('click', decide(true));
      document.getElementById('deny').addEventListener('click', decide(false));
    }
  </script>
</body>
</html>
