<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — GoalAgents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css">
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="../">Goal<span>Agents</span></a>
      <div class="links">
        <a class="wide" href="https://github.com/oponfil/goalagents/blob/main/docs/MCP.md">Docs</a>
        <a href="../pricing/">Pricing</a>
        <a class="gh" href="https://github.com/oponfil/goalagents" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
      </div>
    </nav>

    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">New here? The same steps create your account.</p>

      <div id="google" class="gbtn"></div>

      <div class="or">or with email</div>

      <form id="email-form">
        <input class="field" id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <button class="btn" type="submit">Email me a sign-in link</button>
      </form>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script type="module">
    import { supabase, afterSignIn } from '../src/auth.js';
    import { GOOGLE_CLIENT_ID } from '../src/config.js';

    const msg = document.getElementById('msg');
    const say = (text, kind = '') => { msg.textContent = text; msg.className = 'msg ' + kind; };

    // Already signed in: go straight to the account page.
    const { data: { session } } = await supabase.auth.getSession();
    if (session) location.replace(afterSignIn());

    // Google's own button: the account picker names our site, not the Supabase host.
    // Google gets the hashed nonce, Supabase checks the token against the raw one.
    const nonce = crypto.randomUUID();
    const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(nonce));
    const hashedNonce = [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');

    const gis = document.createElement('script');
    gis.src = 'https://accounts.google.com/gsi/client?hl=en';
    gis.onload = () => {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        nonce: hashedNonce,
        callback: async ({ credential }) => {
          say('Signing in…');
          const { error } = await supabase.auth.signInWithIdToken({ provider: 'google', token: credential, nonce });
          if (error) say(error.message, 'error');
          else location.replace(afterSignIn());
        },
      });
      const box = document.getElementById('google');
      google.accounts.id.renderButton(box, {
        theme: 'filled_black', size: 'large', shape: 'rectangular', text: 'continue_with', locale: 'en',
        width: Math.min(400, box.clientWidth),
      });
    };
    document.head.append(gis);

    document.getElementById('email-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      say('Sending…');
      const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: afterSignIn() } });
      if (error) say(error.message, 'error');
      else say(`Check ${email} for a sign-in link.`, 'ok');
    });
  </script>
</body>
</html>
